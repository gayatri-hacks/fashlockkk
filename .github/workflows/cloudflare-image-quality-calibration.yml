name: Cloudflare Image Quality Calibration

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: Manual calibration keyword (layering only).
        required: false
        default: layering

permissions:
  contents: read

concurrency:
  group: cloudflare-image-quality-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calibration:
    name: Generate temporary Cloudflare calibration images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: ${{ vars.CLOUDFLARE_IMAGE_MODEL }}
      CLOUDFLARE_VISION_MODEL: ${{ vars.CLOUDFLARE_VISION_MODEL }}
      IMAGE_OCR_PROVIDER: ${{ vars.IMAGE_OCR_PROVIDER }}
      IMAGE_SEMANTIC_VALIDATOR_FALLBACK_PROVIDER: disabled
      CALIBRATION_KEYWORDS: ${{ inputs.keywords }}
      CALIBRATION_MAX_TEMPORARY_IMAGES: 3
      CALIBRATION_OUTPUT_DIR: .tmp/cloudflare-image-quality-calibration

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tesseract runtime
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Node dependencies
        run: npm ci

      - name: Validate calibration configuration
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID secret is required" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN secret is required" && exit 1)
          test -n "$CLOUDFLARE_IMAGE_MODEL" || (echo "CLOUDFLARE_IMAGE_MODEL repository variable is required" && exit 1)
          test -n "$CLOUDFLARE_VISION_MODEL" || (echo "CLOUDFLARE_VISION_MODEL repository variable is required" && exit 1)
          test "${IMAGE_OCR_PROVIDER:-local_tesseract}" = "local_tesseract" || (echo "IMAGE_OCR_PROVIDER must be local_tesseract for this calibration" && exit 1)
          test -n "$CALIBRATION_KEYWORDS" || (echo "CALIBRATION_KEYWORDS input is required" && exit 1)

      - name: Run Cloudflare image quality calibration
        env:
          IMAGE_OCR_PROVIDER: local_tesseract
        run: npm run images:calibrate:cloudflare

      - name: Upload redacted calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-image-quality-calibration
          path: .tmp/cloudflare-image-quality-calibration
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up temporary calibration files
        if: always()
        run: rm -rf .tmp/cloudflare-image-quality-calibration
