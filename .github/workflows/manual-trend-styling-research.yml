name: Manual trend styling research
on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Canonical fashion keyword to research"
        required: true
        default: "linen"
        type: string
      market:
        description: "Requesting user market"
        required: true
        default: "IN"
        type: choice
        options:
          - "IN"
          - "US"
          - "GB"
          - "FR"
          - "IT"
          - "DE"
          - "JP"
          - "KR"
          - "AU"
          - "BR"
          - "SG"
          - "AE"
      season:
        description: "Bounded styling season label"
        required: true
        default: "current"
        type: string
      create_job:
        description: "Create the single isolated research job (disabled by default)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      execute:
        description: "Run one claimed styling-research job (disabled by default)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      enqueue_images:
        description: "Enqueue six formula images only after approval"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
permissions:
  contents: read
concurrency:
  group: manual-trend-styling-research
  cancel-in-progress: false
jobs:
  styling-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TREND_FORMULA_TEXT_PROVIDER: ${{ vars.TREND_FORMULA_TEXT_PROVIDER }}
      TREND_FORMULA_TEXT_FALLBACK_PROVIDER: ${{ vars.TREND_FORMULA_TEXT_FALLBACK_PROVIDER }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TEXT_MODEL: ${{ vars.CLOUDFLARE_TEXT_MODEL }}
      TREND_STYLING_INTELLIGENCE_ENABLED: ${{ inputs.execute == 'true' && 'true' || 'false' }}
      ENABLE_WEEKLY_TREND_STYLE_REFRESH: "false"
      TREND_SEARCH_RESEARCH_ENQUEUE_ENABLED: "false"
      AUTO_ENQUEUE_FORMULA_IMAGES_ENABLED: ${{ inputs.execute == 'true' && inputs.enqueue_images == 'true' && 'true' || 'false' }}
      TREND_MARKET_DISCOVERY_MAX_PROVIDER_CALLS: "18"
      TREND_MARKET_DISCOVERY_MAX_ATTEMPTS: "3"
      TREND_MARKET_DISCOVERY_REQUEST_DELAY_SECONDS: "12"
      TREND_MARKET_DISCOVERY_CACHE_TTL_HOURS: "24"
      TREND_MARKET_DISCOVERY_TIMEOUT_MS: "360000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore bounded market-discovery cache
        uses: actions/cache@v4
        with:
          path: .cache/trend-styling-market-discovery
          key: trend-styling-market-discovery-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trend-styling-market-discovery-${{ runner.os }}-
      - run: npm ci
      - name: Install repository Google Trends collector dependencies
        run: python -m pip install -r scraper/requirements.txt
      - name: Verify market discovery without provider calls
        run: |
          python -B -m py_compile scraper/discover_keyword_markets.py
          python -B -m unittest scraper/test_discover_keyword_markets.py
      - name: Validate execution secrets
        if: ${{ inputs.execute == 'true' }}
        shell: bash
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SERPER_API_KEY TREND_FORMULA_TEXT_PROVIDER; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is required for manual styling research"
              missing=1
            fi
          done
          if [ "$TREND_FORMULA_TEXT_PROVIDER" = "cloudflare" ]; then
            for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_TEXT_MODEL; do
              if [ -z "${!name}" ]; then
                echo "::error title=Missing Cloudflare formula configuration::$name is required"
                missing=1
              fi
            done
          elif [ "$TREND_FORMULA_TEXT_PROVIDER" = "gemini" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Missing Gemini formula configuration::GEMINI_API_KEY is required"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Run repo-owned market discovery before styling evidence collection
        shell: bash
        env:
          MANUAL_STYLING_KEYWORD: ${{ inputs.keyword }}
          MANUAL_STYLING_MARKET: ${{ inputs.market }}
          MANUAL_STYLING_SEASON: ${{ inputs.season }}
          MANUAL_STYLING_CREATE_JOB: ${{ inputs.create_job }}
          MANUAL_STYLING_EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          args=(
            --keyword "$MANUAL_STYLING_KEYWORD"
            --market "$MANUAL_STYLING_MARKET"
            --season "$MANUAL_STYLING_SEASON"
          )
          if [ "$MANUAL_STYLING_CREATE_JOB" = "true" ]; then
            args+=(--create-job)
          fi
          if [ "$MANUAL_STYLING_EXECUTE" = "true" ]; then
            args+=(--execute)
            if [ "$MANUAL_STYLING_CREATE_JOB" = "true" ]; then
              args+=(--confirm-manual-job-creation)
            fi
          else
            args+=(--dry-run)
          fi
          node --import tsx scripts/run-manual-trend-styling-research.ts "${args[@]}"
